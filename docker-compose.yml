services:
  server:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-pet_feeder_iot}
      DB_USER: ${MYSQL_USER:-pet_feeder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      DB_SSL: ${DB_SSL:-false}
      DB_ALLOW_RESET: ${DB_ALLOW_RESET:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_in_production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-x-request-id}
      REJECT_PROTOTYPE_POLLUTION: ${REJECT_PROTOTYPE_POLLUTION:-true}
      HSTS_MAX_AGE_SEC: ${HSTS_MAX_AGE_SEC:-15552000}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      LINK_DEVICE_RATE_LIMIT_WINDOW_MS: ${LINK_DEVICE_RATE_LIMIT_WINDOW_MS:-900000}
      LINK_DEVICE_RATE_LIMIT_MAX: ${LINK_DEVICE_RATE_LIMIT_MAX:-10}
      FEED_NOW_RATE_LIMIT_WINDOW_MS: ${FEED_NOW_RATE_LIMIT_WINDOW_MS:-60000}
      FEED_NOW_RATE_LIMIT_MAX: ${FEED_NOW_RATE_LIMIT_MAX:-20}
      CONFIG_GENERATION_RATE_LIMIT_WINDOW_MS: ${CONFIG_GENERATION_RATE_LIMIT_WINDOW_MS:-600000}
      CONFIG_GENERATION_RATE_LIMIT_MAX: ${CONFIG_GENERATION_RATE_LIMIT_MAX:-15}
      ADMIN_SENSITIVE_RATE_LIMIT_WINDOW_MS: ${ADMIN_SENSITIVE_RATE_LIMIT_WINDOW_MS:-600000}
      ADMIN_SENSITIVE_RATE_LIMIT_MAX: ${ADMIN_SENSITIVE_RATE_LIMIT_MAX:-30}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-System Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123456}
      SEED_MQTT_SERVER_NAME: ${SEED_MQTT_SERVER_NAME:-local-broker}
      SEED_MQTT_HOST: ${SEED_MQTT_HOST:-127.0.0.1}
      SEED_MQTT_PORT: ${SEED_MQTT_PORT:-1883}
      SEED_MQTT_TLS_PORT: ${SEED_MQTT_TLS_PORT:-8883}
      SEED_MQTT_WEBSOCKET_PORT: ${SEED_MQTT_WEBSOCKET_PORT:-9001}
      SEED_MQTT_USE_TLS: ${SEED_MQTT_USE_TLS:-false}
      SEED_DEMO_DEVICE_ID: ${SEED_DEMO_DEVICE_ID:-feeder001}
      SEED_DEMO_MACHINE_CODE: ${SEED_DEMO_MACHINE_CODE:-PF-ESP8266-001}
      SEED_DEMO_PAIRING_CODE: ${SEED_DEMO_PAIRING_CODE:-A8K2-91PQ}
      SEED_DEMO_DEVICE_SECRET: ${SEED_DEMO_DEVICE_SECRET:-CHANGE_ME_DEVICE_SECRET}
      SEED_DEMO_MQTT_USERNAME: ${SEED_DEMO_MQTT_USERNAME:-feeder001}
      SEED_DEMO_MQTT_PASSWORD: ${SEED_DEMO_MQTT_PASSWORD:-feeder001_dev_password}
    ports:
      - "8871:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pet_feeder_iot}
      MYSQL_USER: ${MYSQL_USER:-pet_feeder}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ~/data/pawfeed-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
