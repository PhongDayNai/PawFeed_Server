openapi: 3.1.0
info:
  title: Pet Feeder API
  version: 1.0.0
  description: Pet Feeder IoT Platform API

servers:
  - url: /v1
    description: Current server (relative)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
        totalPages:
          type: integer

    LoginResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, inactive, disabled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        deviceId:
          type: string
        machineCode:
          type: string
        displayName:
          type: string
          nullable: true
        status:
          type: string
          enum: [not_configured, linked, config_generated, configured, online, offline, disabled, revoked, unlinked]
        firmwareVersion:
          type: string
          nullable: true
        ownerUserId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeviceStatus:
      type: object
      properties:
        deviceId:
          type: string
        online:
          type: boolean
        status:
          type: string
          enum: [not_configured, linked, config_generated, configured, online, offline, disabled, revoked, unlinked]
        lastSeen:
          type: string
          format: date-time
          nullable: true

    MqttStatus:
      type: object
      properties:
        deviceId:
          type: string
        connected:
          type: boolean
        lastConnectedAt:
          type: string
          format: date-time
          nullable: true
        lastDisconnectedAt:
          type: string
          format: date-time
          nullable: true

    CurrentConfig:
      type: object
      properties:
        deviceId:
          type: string
        version:
          type: integer
        wifiSsid:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        addressNote:
          type: string
          nullable: true
        timezone:
          type: string
          default: Asia/Bangkok
        timezoneOffsetSec:
          type: integer
          default: 25200
        keepSetupApEnabled:
          type: boolean
          default: false
        openDurationMs:
          type: integer
          minimum: 100
          maximum: 600000
          nullable: true
        enableNotifications:
          type: boolean
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ScheduleEntry:
      type: object
      required: [time, openDurationMs]
      properties:
        time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: HH:mm format (strict)
        openDurationMs:
          type: integer
          minimum: 100
          maximum: 600000
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          default: [0, 1, 2, 3, 4, 5, 6]

    Schedule:
      type: object
      properties:
        deviceId:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
          default: true
        timezone:
          type: string
          nullable: true
        timezoneOffsetSec:
          type: integer
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleEntry'
          maxItems: 8
        updatedAt:
          type: string
          format: date-time

    ScheduleApplyStatus:
      type: object
      properties:
        deviceId:
          type: string
        applied:
          type: boolean
        appliedAt:
          type: string
          format: date-time
          nullable: true
        pendingConfigId:
          type: string
          nullable: true

    ConfigFileJsonResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        fileName:
          type: string
        configId:
          type: string
        configVersion:
          type: integer
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        content:
          type: string

    ConfigGeneration:
      type: object
      properties:
        configId:
          type: string
        deviceId:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [generated, downloaded, applied, expired, revoked, failed]
        checksum:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        appliedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true

    Command:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        action:
          type: string
          enum: [feed_once]
        status:
          type: string
          enum: [pending, published, accepted, rejected, completed, failed, timeout, queued]
        openDurationMs:
          type: integer
          minimum: 100
          maximum: 600000
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommandQueueItem:
      type: object
      properties:
        requestId:
          type: string
        action:
          type: string
          enum: [feed_once]
        openDurationMs:
          type: integer
          minimum: 100
          maximum: 600000
        queuedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued]
        position:
          type: integer
          minimum: 1

    DeviceEvent:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        eventType:
          type: string
        source:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        configId:
          type: string
          nullable: true
        payload:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    FeedingHistory:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        requestId:
          type: string
          nullable: true
        scheduleId:
          type: string
          nullable: true
        source:
          type: string
          enum: [remote, schedule, manual, test]
        status:
          type: string
          enum: [completed, failed, timeout, cancelled]
        openDurationMs:
          type: integer
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MqttServer:
      type: object
      properties:
        id:
          type: integer
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
          enum: [mqtt, mqtts, ws, wss]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MqttCredential:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        mqttUsername:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SystemSettings:
      type: object
      properties:
        accessTokenExpirySeconds:
          type: integer
        refreshTokenExpirySeconds:
          type: integer
        maxLoginAttempts:
          type: integer
        lockoutDurationSeconds:
          type: integer
        configTtlSeconds:
          type: integer

  parameters:
    deviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    configId:
      name: configId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    mqttServerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict or version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


paths:
  # ─── Health ─────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  status:
                    type: string
                    const: healthy

  # ─── Auth ────────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  nullable: true
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 255
                  description: Must contain uppercase, lowercase, digit, and special character
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account disabled or locked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (client should discard tokens)
      responses:
        '200':
          description: Logout accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 255
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 255
                confirmNewPassword:
                  type: string
                  minLength: 8
                  maxLength: 255
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  user:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ─── Account ─────────────────────────────────────────────────────────────────

  /account/profile:
    patch:
      tags: [Account]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  nullable: true
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Dashboard ───────────────────────────────────────────────────────────────

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get user dashboard summary
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  totalDevices:
                    type: integer
                  onlineDevices:
                    type: integer
                  offlineDevices:
                    type: integer
                  recentFeedingHistory:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedingHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── SSE ─────────────────────────────────────────────────────────────────────

  /events/stream:
    get:
      tags: [Events]
      summary: Subscribe to server-sent events
      description: |
        Opens a persistent SSE stream. Events are scoped to the authenticated user's devices.

        **Event types:**
        - `device_status_updated` — device came online or went offline
        - `command_updated` — command status changed
        - `feeding_completed` — feeding finished on device
        - `config_applied` — config sync completed on device
        - `device_error` — device reported an error
        - `heartbeat` — keep-alive ping every 60 seconds

        Reconnect with `Last-Event-ID` header to replay missed events.
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: Replay events after this ID on reconnect
      responses:
        '200':
          description: SSE stream opened
          headers:
            Content-Type:
              schema:
                type: string
                const: text/event-stream
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE format:
                  ```
                  id: evt_001
                  event: device_status_updated
                  data: {"deviceId":"device_001","online":true,"lastSeen":"2026-05-18T10:00:00.000Z"}

                  id: evt_002
                  event: heartbeat
                  data: {"timestamp":"2026-05-18T10:00:00.000Z"}
                  ```
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ─── Devices ─────────────────────────────────────────────────────────────────

  /devices:
    get:
      tags: [Devices]
      summary: List user's devices
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [not_configured, linked, config_generated, configured, online, offline, disabled, revoked, unlinked]
        - name: online
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/link:
    post:
      tags: [Devices]
      summary: Link a device to the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machineCode, pairingCode]
              properties:
                machineCode:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Device machine code (uppercase alphanumeric with dashes/underscores)
                pairingCode:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: One-time pairing code
      responses:
        '201':
          description: Device linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  device:
                    $ref: '#/components/schemas/Device'
        '200':
          description: Device already linked to this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  alreadyLinked:
                    type: boolean
                    const: true
                  device:
                    $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Machine code not found or pairing code invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Device already linked to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Get device details
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  device:
                    $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Devices]
      summary: Update device display name
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  nullable: true
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  device:
                    $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/unlink:
    post:
      tags: [Devices]
      summary: Unlink device from current user
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200':
          description: Device unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: Get device online/offline status
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200':
          description: Device status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  deviceId:
                    type: string
                  online:
                    type: boolean
                  status:
                    type: string
                  lastSeen:
                    type: string
                    format: date-time
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/mqtt-status:
    get:
      tags: [Devices]
      summary: Get device MQTT connection status
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200':
          description: MQTT status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  deviceId:
                    type: string
                  connected:
                    type: boolean
                  lastConnectedAt:
                    type: string
                    format: date-time
                    nullable: true
                  lastDisconnectedAt:
                    type: string
