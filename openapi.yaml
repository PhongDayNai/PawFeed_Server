                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  settings:
                    $ref: '#/components/schemas/SystemSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List audit logs
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: actorUserId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
        - name: from
          in: query
          schema:
            type: string
            maxLength: 40
        - name: to
          in: query
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        actorUserId:
                          type: integer
                          nullable: true
                        actorRole:
                          type: string
                          nullable: true
                        action:
                          type: string
                        targetType:
                          type: string
                          nullable: true
                        targetId:
                          type: string
                          nullable: true
                        clientIp:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/audit-logs/export:
    get:
      tags: [Admin]
      summary: Export audit logs as CSV
      parameters:
        - name: from
          in: query
          schema:
            type: string
            maxLength: 40
        - name: to
          in: query
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

